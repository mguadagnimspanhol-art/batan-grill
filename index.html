function calcPortion(size,draft=state.draft,catalog=state.catalog,targets=state.targets){
 const t=targets[size],errors=[],entries=[],groupSum={carbo:0,protein:0,beans:0,veg:0};
 if(!t){return {size,errors:['Tamanho não encontrado'],entries:[],valid:false}}
 const cooked=draft.recipe.map(r=>{const item=chooseIngredient(r.ingredientId,catalog);const raw=n(r.rawKg);if(!item||raw===null||raw<=0||!(n(item.yieldFactor)>0)){errors.push('Confira os ingredientes e as quantidades cruas da receita.');return null}return {item,rawKg:raw,cookedKg:raw*Number(item.yieldFactor)}}).filter(Boolean);
 const proteinCooked=cooked.filter(x=>x.item.group==='protein').reduce((a,x)=>a+x.cookedKg,0);
 if(proteinCooked<=0)errors.push('A receita deve conter uma proteína principal com peso cru informado.');
 const scale=proteinCooked>0?Number(t.protein)/(proteinCooked*1000):0;
 cooked.forEach(x=>{const grams=x.cookedKg*1000*scale;entries.push({item:x.item,grams,origin:'Receita do prato'});groupSum[x.item.group]+=grams});
 for(const group of ['carbo','beans','veg']){
  const remaining=Number(t[group])-groupSum[group];
  if(remaining < -.01)errors.push(`A receita já contém ${fm(groupSum[group])} g de ${GROUPS[group]}, acima da meta de ${fm(t[group])} g para ${size}. Reduza a proporção deste ingrediente na receita.`);
  const item=chooseIngredient(draft.base[group],catalog);
  if(!item||item.group!==group)errors.push(`Defina um ingrediente-base válido para ${GROUPS[group]}.`);
  else if(remaining>.001)entries.push({item,grams:remaining,origin:'Base da marmita'});
 }
 if(groupSum.protein-Number(t.protein)>.01)errors.push('Proteína acima da meta.');
 const sum=Object.values(t).reduce((a,b)=>a+(n(b)||0),0);
 const totalGrams=entries.reduce((a,x)=>a+x.grams,0);
 const missing=[...new Set(entries.filter(x=>n(x.item.price)===null||n(x.item.price)<0).map(x=>x.item.name))];
 if(missing.length)errors.push(`Informe o preço do kg cru de: ${missing.join(', ')}.`);
 const prepared=entries.map(x=>({...x,rawKg:x.grams/1000/x.item.yieldFactor,cost:n(x.item.price)!==null?x.grams/1000/x.item.yieldFactor*Number(x.item.price):null}));
 const valid=!errors.length&&Math.abs(sum-totalGrams)<.1;
 const priceTotal=prepared.every(x=>x.cost!==null)?prepared.reduce((a,x)=>a+x.cost,0):null;
 return {size,targets:t,entries:prepared,totalGrams,sum,recipeGrams:prepared.filter(x=>x.origin==='Receita do prato').reduce((a,x)=>a+x.grams,0),errors,valid,foodCost:priceTotal};

function calculate(draft=state.draft,catalog=state.catalog,targets=state.targets){

 for(const o of draft.orders){const count=Math.max(0,n(o.qty)||0),price=n(o.price);if(count===0)continue;qty+=count;
  if(price===null||price<0)errors.push('Informe o preço de venda de todas as marmitas com quantidade maior que zero.');
  const p=portions[o.size];if(!p||!p.valid)errors.push(`Confira a composição de ${o.size}.`);
  const r=price===null?null:price*count;
  revenue+=r||0;if(p?.foodCost!==null&&p?.valid){food+=p.foodCost*count;for(const e of p.entries){if(!foods[e.item.id])foods[e.item.id]={id:e.item.id,name:e.item.name,group:e.item.group,rawKg:0,cost:0};foods[e.item.id].rawKg+=e.rawKg*count;foods[e.item.id].cost+=e.cost*count}}
  orderTotals.push({...o,count,unitPrice:price,revenue:r,food:p?.valid?p.foodCost*count:null,profit:r!==null&&p?.valid?r*(1-TAX)-p.foodCost*count:null});
 }
 if(qty===0)errors.push('Adicione pelo menos uma marmita à programação do dia.');
 if(people<0)errors.push('O número de pessoas não pode ser negativo.');
 if(qty!==people)errors.push(`Atenção: você informou ${fm(people,0)} pessoas e ${fm(qty,0)} marmitas. Confirme se a diferença é intencional.`);
 const portionErrors=[...new Set(orderTotals.flatMap(o=>portions[o.size]?.errors||[]))];
 const blocking=errors.filter(x=>!x.startsWith('Atenção:')).concat(portionErrors);
 const ready=blocking.length===0, tax=revenue*TAX,profit=ready?revenue-tax-food:null,margin=ready&&revenue>0?profit/revenue*100:null;
 return {portions,qty,people,revenue,tax,food:ready?food:null,profit,margin,ready,blocking,warnings:errors.filter(x=>x.startsWith('Atenção:')),orders:orderTotals,foods:Object.values(foods).sort((a,b)=>b.cost-a.cost),totalReadyKg:orderTotals.reduce((a,o)=>a+(portions[o.size]?.totalGrams||0)*o.count/1000,0)};
}

 let error=null;
 try{
  const result=await client.from('app_state').upsert({id:1,payload,updated_by:session.user.id,updated_at:new Date().toISOString()},{onConflict:'id'});
  error=result.error;
 }catch(e){error=e}
 cloudSaving=false;
 if(error){syncError='Não foi possível guardar os preços e o cardápio na nuvem: '+error.message;toast(syncError,'error')}
 else syncError='';
 if(cloudSavePending){cloudSavePending=false;cloudSaveTimer=setTimeout(()=>saveCloudState(),150)}
}
async function loadCloudState(){
 if(!client||!session||role!=='manager')return;
 const {data,error}=await client.from('app_state').select('payload').eq('id',1).maybeSingle();
 if(error){syncError='Erro ao obter preços da nuvem: '+error.message;return}
 if(data?.payload && Array.isArray(data.payload.catalog)&&data.payload.targets&&data.payload.draft){
  state.catalog=mergeBaseCuts(structuredClone(data.payload.catalog));
  state.targets=structuredClone(data.payload.targets);
  state.draft=structuredClone(data.payload.draft);
  persist();
 } else if(!data){await saveCloudState()}
}
async function importLocalReportsToCloud(){
 if(!isCloud()||!session||role!=='manager')return;
 const backups=pendingLocalReports();
 const existing=new Set(state.reports.map(r=>r.report_date));
 const missing=backups.filter(r=>r.report_date&&r.payload?.draft&&!existing.has(r.report_date));
 if(!missing.length){toast('Não há relatórios locais pendentes de importação.');return}
 if(!confirm('Enviar '+missing.length+' relatórios locais ao banco? Relatórios já existentes na nuvem serão preservados.'))return;
 const batch=missing.map(r=>({report_date:r.report_date,payload:r.payload,created_by:session.user.id}));
 const {error}=await client.from('day_reports').insert(batch);
 if(error){toast('Falha na importação: '+error.message,'error');return}
 await fetchReports();toast(missing.length+' relatórios locais enviados para a nuvem.');
}
async function startCloud(){if(!isCloud()){session=null;role='viewer';render();return}try{if(!localStorage.getItem(PRE_CLOUD_BACKUP_KEY))localStorage.setItem(PRE_CLOUD_BACKUP_KEY,JSON.stringify(state))}catch(e){}cloudLoading=true;render();try{if(!window.supabase){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=()=>reject(new Error('Biblioteca de nuvem indisponível. Verifique sua internet.'));document.head.appendChild(s)})}client=window.supabase.createClient(cloudCfg.url,cloudCfg.anonKey);const {data,error}=await client.auth.getSession();if(error)throw error;session=data.session;if(session)await afterLogin();else{cloudLoading=false;render()}}catch(e){cloudLoading=false;syncError=`Falha ao conectar à nuvem: ${e.message}`;session=null;render()}}
async function afterLogin(){
 cloudLoading=true;render();
 const {data,error}=await client.from('profiles').select('role').eq('user_id',session.user.id).maybeSingle();
 if(error||!data?.role){
  cloudLoading=false;
  authError=error?'Banco de dados ainda não configurado: '+error.message:'Sua conta não tem permissão cadastrada. Peça ao administrador para autorizá-la no Supabase.';
  session=null;role='viewer';await client.auth.signOut();renderLogin();return;
 }
 role=data.role;
 if(role==='manager')await loadCloudState();
 await fetchReports();
 cloudLoading=false;tab=readOnly()?'consulta':'planejamento';render();
 try{
  client.removeAllChannels();
  let channel=client.channel('batan-relatorios').on('postgres_changes',{event:'*',schema:'public',table:'day_reports'},()=>fetchReports());
  if(role==='manager')channel=channel.on('postgres_changes',{event:'*',schema:'public',table:'app_state'},()=>{
   if(!cloudSaving&&!cloudSaveTimer&&!document.activeElement?.matches('input,select,textarea'))loadCloudState().then(()=>render());
  });
  channel.subscribe();
 }catch(e){}
}
async function fetchReports(){if(!client||!session)return;const {data,error}=await client.from('day_reports').select('report_date,payload').order('report_date',{ascending:false}).limit(365);if(error){syncError=`Erro ao buscar relatórios: ${error.message}`;return}syncError='';state.reports=data||[];persist();if(!selectedDate||!state.reports.some(r=>r.report_date===selectedDate))selectedDate=state.reports[0]?.report_date||null;render()}
function loginSubmit(e){e.preventDefault();if(loginPending)return;const form=e.target;const email=form.querySelector('[name=email]').value.trim(),password=form.querySelector('[name=password]').value;loginPending=true;authError='';renderLogin();client.auth.signInWithPassword({email,password}).then(async ({data,error})=>{loginPending=false;if(error){authError='E-mail ou senha inválidos ou conta não autorizada.';renderLogin();return}session=data.session;await afterLogin()}).catch(err=>{loginPending=false;authError=err.message;renderLogin()})}
async function onAction(action,el){const idx=Number(el.dataset.idx),date=el.dataset.date;
 if(action==='tab'){tab=el.dataset.tab;state.preferredTab=tab;persist();render();return}
 if(action==='save'){await saveReport();return}
 if(action==='result-tab'){tab='resultado';render();return}
 if(action==='ingredients-tab'){tab='ingredientes';render();return}
 if(action==="review-prices"){tab="ingredientes";state.preferredTab=tab;persist();render();return}
 if(action==="confirm-price-review"){if(!confirm("Você conferiu os preços atuais dos ingredientes?"))return;try{localStorage.setItem(PRICE_REVIEW_KEY,JSON.stringify({week:mondayWeekKey(),checkedAt:new Date().toISOString()}))}catch(e){toast("Não foi possível salvar a conferência neste navegador.","error");return}toast("Conferência dos preços registrada!");render();return}
 if(action==='add-order'){state.draft.orders.push({id:newId(),customer:'Novo contrato',size:'G',qty:0,price:19})}
 if(action==='remove-order'){if(state.draft.orders.length<=1){toast('Mantenha pelo menos uma linha de pedido.','error');return}state.draft.orders.splice(idx,1)}
 if(action==='add-recipe'){state.draft.recipe.push({id:newId(),ingredientId:'batata',rawKg:.5})}
 if(action==='remove-recipe'){if(state.draft.recipe.length<=1){toast('Mantenha pelo menos um ingrediente na receita.','error');return}state.draft.recipe.splice(idx,1)}
 if(action==='sample-chicken'){state.draft.menu='Frango com arroz, feijão e legumes';state.draft.recipe=[{id:newId(),ingredientId:'frango',rawKg:1}];toast('Modelo de frango carregado. Confira os preços e o rendimento.')}
 if(action==='sample-mixed'){state.draft.menu='Carne moída com batata, arroz, feijão e legumes';state.draft.recipe=[{id:newId(),ingredientId:'carne_moida',rawKg:1},{id:newId(),ingredientId:'batata',rawKg:.6}];toast('Modelo de carne moída com batata carregado. Ajuste as quantidades cruas da receita.')}
 if(action==='add-catalog'){const name=document.getElementById('new-name')?.value.trim(),group=document.getElementById('new-group')?.value,y=n(document.getElementById('new-yield')?.value);if(!name||!GROUPS[group]||!(y>0)){toast('Informe nome, grupo e rendimento válido.','error');return}state.catalog.push({id:newId(),name,group,yieldFactor:y,price:null,subcategory:group==='protein'?document.getElementById('new-subgroup').value:GROUPS[group]});toast('Ingrediente cadastrado.')}
 if(action==='remove-catalog'){const it=state.catalog[idx];if(!it)return;const used=state.draft.recipe.some(r=>r.ingredientId===it.id)||Object.values(state.draft.base).includes(it.id);if(used){toast('Esse ingrediente está sendo usado no cardápio atual. Substitua-o antes de excluir.','error');return}if(!confirm(`Excluir ${it.name}?`))return;state.catalog.splice(idx,1)}
 if(action==='select-report'){selectedDate=date;state.selectedDate=date;persist()}
 if(action==='open-selected'){tab=readOnly()?'consulta':'resultado';if(!readOnly()&&getReport()){const r=getReport();state.draft=structuredClone(r.payload.draft);state.catalog=mergeBaseCuts(structuredClone(r.payload.catalog));state.targets=structuredClone(r.payload.targets)}}
 if(action==='edit-selected'){const r=getReport();if(!r)return;state.draft=structuredClone(r.payload.draft);state.catalog=mergeBaseCuts(structuredClone(r.payload.catalog));state.targets=structuredClone(r.payload.targets);tab='planejamento';toast('Relatório carregado para edição. Salve para atualizar.')}
 if(action==='print'){window.print();return}
 if(action==='csv'){exportCsv();return}
 if(action==='share'){shareReport();return}
 if(action==='copy-view-link'){copyViewLink();return}
 if(action==='backup'){download('batan-grill-backup-'+today()+'.json','application/json;charset=utf-8',JSON.stringify(state,null,2));return}
 if(action==='import-local-reports'){await importLocalReportsToCloud();return}
 if(action==='save-cloud'){const url=document.getElementById('cloud-url').value.trim().replace(/\/$/,'');const key=document.getElementById('cloud-key').value.trim();if((url&&!key)||(!url&&key)){toast('Preencha URL e chave pública juntas.','error');return}if(url&&!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)){toast('Informe uma URL válida do Supabase.','error');return}cloudCfg={url,anonKey:key};localStorage.setItem(CLOUD_STORAGE,JSON.stringify(cloudCfg));if(isCloud())await startCloud();else render();return}
 if(action==='remove-cloud'){if(!confirm('Sair da nuvem e usar apenas os dados deste navegador?'))return;cloudCfg={url:'',anonKey:''};localStorage.setItem(CLOUD_STORAGE,JSON.stringify(cloudCfg));session=null;client=null;role='viewer';syncError='';toast('Modo local ativado.')}
 if(action==='logout'){await client?.auth.signOut();session=null;role='viewer';state.reports=[];state.catalog=structuredClone(baseCatalog);state.draft=defaultDraft();state.targets=structuredClone(defTargets);persist();tab='consulta';renderLogin();return}
 persist();queueCloudStateSave();render()}
document.addEventListener('change',async e=>{const x=e.target;if(x.dataset.bind){if(readOnly())return;updateBind(x.dataset.bind,x.value)}if(x.id==='import-file'){if(isCloud()){toast('Faça backup/restauração pelo banco de dados na nuvem.','error');return}const f=x.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.catalog)||!data.targets||!data.draft||!Array.isArray(data.reports))throw new Error('Formato inválido');if(!confirm('Restaurar este backup? Os dados locais atuais serão substituídos.'))return;state=data;state.catalog=mergeBaseCuts(state.catalog);state.catalogSchema=CATALOG_SCHEMA;persist();render();toast('Backup restaurado.')}catch(err){toast(`Backup inválido: ${err.message}`,'error')}}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();onAction(b.dataset.action,b).catch(err=>toast(err.message,'error'))}});
document.addEventListener('submit',e=>{if(e.target.id==='login-form')loginSubmit(e)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isCloud()&&session){fetchReports();if(role==='manager'&&!cloudSaving&&!cloudSaveTimer)loadCloudState().then(()=>render())}});
if(sharedReport){selectedDate=sharedReport.report_date;tab='consulta';render()}else if(isCloud())startCloud();else render();
})();

</script>
</body>
</html>
