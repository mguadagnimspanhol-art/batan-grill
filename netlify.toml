# Batan Grill — site estático com publicação automática pelo Netlify.
# Vincule o repositório GitHub mguadagnimspanhol-art/batan-grill
# e escolha o plano Free. Não é necessário comando de build.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Evita servir uma configuração antiga do banco após troca da chave pública.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Senhas nunca devem ficar em arquivos públicos.
